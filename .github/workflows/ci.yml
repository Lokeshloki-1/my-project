name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Django + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hazpo
          POSTGRES_USER: hazpo
          POSTGRES_PASSWORD: hazpo_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hazpo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_DB: hazpo
      POSTGRES_USER: hazpo
      POSTGRES_PASSWORD: hazpo_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Django system check
        run: python manage.py check
      - name: Run tests
        run: python manage.py test apps

  frontend:
    name: Frontend build (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  production-stack:
    name: Production Docker stack starts and is healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a throwaway .env.prod (plain HTTP on :80)
        run: |
          cp .env.prod.example .env.prod
          sed -i 's|^SITE_ADDRESS=.*|SITE_ADDRESS=:80|; s|^DJANGO_ALLOWED_HOSTS=.*|DJANGO_ALLOWED_HOSTS=localhost|' .env.prod
          sed -i "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=$(openssl rand -hex 32)|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env.prod
      - name: Build and start
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --wait --wait-timeout 180
      - name: Smoke test through Caddy
        run: |
          curl -fsS http://localhost/api/health/
          curl -fsS -o /dev/null http://localhost/
          curl -fsS -o /dev/null http://localhost/invoices
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/invoices/)" = "401"
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail 100
